# Landing frontend'i icin lint, tip kontrolu ve Playwright davranis testleri.
# Gorsel snapshot testleri burada calismaz: referanslar yerel Linux/Chromium
# font cizimiyle alindi, GitHub runner'inda piksel farki uretip yanlis alarm verir.
# Bagimliliklar npm workspaces ile kokte kurulur, komutlar uygulamanin kendi
# klasorunde calisir.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  landing:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/landing/playwright-report
            apps/landing/test-results
          retention-days: 7
