# PaktLabs sitelerinin lint, tip kontrolu ve Playwright davranis testleri,
# iletisim servisinin pytest testleri.
# Bagimliliklar npm workspaces ile kokte kurulur. Lint butun repoyu tek seferde
# tarar, her uygulama kendi job'unda tip kontrolu ve testlerini calistirir.
# Gorsel snapshot testleri burada calismaz: referanslar yerel Linux/Chromium
# font cizimiyle alindi, GitHub runner'inda piksel farki uretip yanlis alarm verir.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  brand:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/brand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run typecheck

  landing:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-landing
          path: |
            apps/landing/playwright-report
            apps/landing/test-results
          retention-days: 7

  data:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-data
          path: |
            apps/data/playwright-report
            apps/data/test-results
          retention-days: 7

  # Servis sunucuda Python 3.10 ile calisir, testler de o surumle kosar ki
  # sunucuda calismayacak bir kod buradan gecmesin. test_contract.py landing'in
  # questions.ts dosyasini okur, bu yuzden butun repo checkout edilir.
  contact-api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/contact-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: services/contact-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
