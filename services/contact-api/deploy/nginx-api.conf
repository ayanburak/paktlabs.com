# /etc/nginx/snippets/paktlabs-api.conf
# paktlabs.com server blogunun icinden include edilir. Yalnizca bu iki adres
# servise aktarilir, /api altindaki baska her adres sitenin bulunamadi
# sayfasina duser. Kendi add_header satiri olan location ust seviyedeki
# basliklari devralmadigi icin guvenlik basliklari burada da include edilir.

location = /api/contact {
    limit_except POST { deny all; }
    limit_req zone=paktlabs_contact burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    add_header Cache-Control "no-store";
    include snippets/paktlabs-security-headers.conf;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
}

location = /api/health {
    limit_except GET { deny all; }
    add_header Cache-Control "no-store";
    include snippets/paktlabs-security-headers.conf;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
}
