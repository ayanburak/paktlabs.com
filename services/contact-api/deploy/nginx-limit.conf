# /etc/nginx/conf.d/paktlabs-api.conf
# Iletisim formunun gonderim siniri. Ayni IP adresinden dakikada bes istek,
# uzerine uc isteklik pay. Asan istek 429 alir. limit_req_zone http
# seviyesinde tanimlanmak zorunda, bu yuzden server blogunda degil burada.
limit_req_zone $binary_remote_addr zone=paktlabs_contact:1m rate=5r/m;
